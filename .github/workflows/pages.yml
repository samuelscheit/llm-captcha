name: Pages
# The leaderboard page, rendered from the committed results (no model calls): on every push that
# changes them, by hand, and from the weekly benchmark after it commits new ones.
on:
  push:
    branches: [main]
    paths: [benchmarks/**, fixtures/**, src/tools/benchmark/**, .github/workflows/pages.yml]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # main, not the triggering commit: called from the benchmark, the new results came after it.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun src/tools/benchmark/publish.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
